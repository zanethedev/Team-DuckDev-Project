
<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="js/teacher.js"></script>
    <link rel='stylesheet' href='css/genStyle.css'>
    <title>Teacher Dashboard</title>
</head>

<body>
    
    <div class="navigation-header">

        <a href="index.html">Return to Homepage</a>

        <div class="history-controls">
            <label for="historyDate">View Past Records:</label>
            <input type="date" id="historyDate">
            <button id="loadDateButton">View</button>
            <button id="todayButton">Today</button>
        </div>

    </div>
    </div>

    <main class="content-panel">

        <!-- Teacher Login -->
        <section id="loginSection">
            <h1>Teacher Login</h1>

            <form id="loginForm">
                <label for="teacherPassword">Password:</label>
                <input type="password" id="teacherPassword" required>

                <button type="submit">Login</button>

                <p id="loginMessage"></p>
            </form>
        </section>

        <!-- Teacher Dashboard -->
        <section id="dashboardSection" hidden>

            <h1 id="date"></h1>

            <div class="periodButtons">
                <button onclick="showPeriod(1)">Period 1</button>
                <button onclick="showPeriod(2)">Period 2</button>
                <button onclick="showPeriod(3)">Period 3</button>
                <button onclick="showPeriod(4)">Period 4</button>
            </div>

            <br><br>

            <h2 id="periodTitle">Period 1 Records</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Student Number</th>
                        <th>Sign-Out Time</th>
                        <th>Sign-In Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="recordsTable"></tbody>
            </table>

        </section>


    
    <section id="editSection" hidden>
        <h3>Edit Student Record</h3>

        <form id="editForm">

            <div class="edit-row">
                <div class="edit-field">
                    <label for="editName">Student Name:</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="edit-field">
                    <label for="editNumber">Student Number:</label>
                    <input type="text" id="editNumber" required>
                </div>
            </div>

            <div class="edit-row">
                <div class="edit-field">
                    <label for="editOutTime">Sign-Out Time:</label>
                    <input type="text" id="editOutTime" required>
                </div>

                <div class="edit-field">
                    <label for="editInTime">Sign-In Time:</label>
                    <input type="text" id="editInTime">
                </div>
            </div>

            <div class="edit-buttons">
                <button type="submit">Save Changes</button>
                <button type="button" id="cancelEdit">Cancel</button>
            </div>

        </form>
    </section>



    </main>
</body>
</html>
